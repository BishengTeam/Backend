# Merge this job into the deployment-owned prometheus.yml.  Do not commit the
# real token; render it from the same read-only secret mounted into Backend.
scrape_configs:
  - job_name: wemini-quiz-backend
    metrics_path: /internal/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/wemini_quiz_metrics_token
    static_configs:
      - targets:
          - backend.internal.example:8000
        labels:
          environment: staging
          service: wemini-backend
    scrape_interval: 15s
    scrape_timeout: 5s

rule_files:
  - /etc/prometheus/rules/quiz-alerts.yml
