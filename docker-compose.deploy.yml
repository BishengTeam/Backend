x-backend-environment: &backend_environment
  APP_ENV: production
  APP_DEBUG: "false"
  RUN_MIGRATIONS: "false"
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:?DB_PORT is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_URL_FILE: /run/secrets/redis_url
  JWT_SECRET_FILE: /run/secrets/jwt_secret
  PII_HASH_KEY_FILE: /run/secrets/pii_hash_key
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "120"
  # Empty is valid only for a clean installation. Existing administrator
  # data makes adm001 fail closed until operations records a verified backup.
  ADMIN_SECURITY_MIGRATION_BACKUP_REF: ${ADMIN_SECURITY_MIGRATION_BACKUP_REF:-}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  WECHAT_APPID: ${WECHAT_APPID:?WECHAT_APPID is required}
  WECHAT_SECRET_FILE: /run/secrets/wechat_secret
  WECHAT_PAY_ENABLED: "true"
  WECHAT_PAY_API_VERSION: v3
  WECHAT_PAY_MCHID: ${WECHAT_PAY_MCHID:?WECHAT_PAY_MCHID is required}
  WECHAT_PAY_APPID: ${WECHAT_PAY_APPID:?WECHAT_PAY_APPID is required}
  WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:?WECHAT_PAY_NOTIFY_URL is required}
  WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:?WECHAT_PAY_REFUND_NOTIFY_URL is required}
  WECHAT_PAY_CERT_SERIAL_NO: ${WECHAT_PAY_CERT_SERIAL_NO:?WECHAT_PAY_CERT_SERIAL_NO is required}
  WECHAT_PAY_PRIVATE_KEY_FILE: /run/secrets/wechat_pay_private_key
  WECHAT_PAY_API_V3_KEY_FILE: /run/secrets/wechat_pay_api_v3_key
  WECHAT_PAY_PUBLIC_KEY_FILE: /run/secrets/wechat_pay_public_key
  WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:?WECHAT_PAY_PUBLIC_KEY_ID is required}
  WECHAT_PAY_NOTIFICATION_TOLERANCE_SECONDS: "300"
  WECHAT_PAY_RECONCILE_POLL_SECONDS: ${WECHAT_PAY_RECONCILE_POLL_SECONDS:-30}
  WECHAT_PAY_RECONCILE_BATCH_SIZE: ${WECHAT_PAY_RECONCILE_BATCH_SIZE:-100}
  WECHAT_PAY_REFUND_RECONCILE_POLL_SECONDS: ${WECHAT_PAY_REFUND_RECONCILE_POLL_SECONDS:-30}
  WECHAT_PAY_REFUND_RECONCILE_BATCH_SIZE: ${WECHAT_PAY_REFUND_RECONCILE_BATCH_SIZE:-100}
  WECHAT_PAY_REFUND_RECONCILE_AFTER_SECONDS: ${WECHAT_PAY_REFUND_RECONCILE_AFTER_SECONDS:-60}
  WECHAT_PAY_SYNC_RATE_PER_MINUTE: ${WECHAT_PAY_SYNC_RATE_PER_MINUTE:-10}
  UPLOAD_DIR: /app/uploads
  STORAGE_TYPE: local
  RENSHE_STORAGE_TYPE: ${RENSHE_STORAGE_TYPE:-disabled}
  ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
  ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
  ALIYUN_OSS_ACCESS_KEY_ID_FILE: /run/secrets/aliyun_oss_access_key_id
  ALIYUN_OSS_ACCESS_KEY_SECRET_FILE: /run/secrets/aliyun_oss_access_key_secret
  ALIYUN_OSS_PREFIX: ${ALIYUN_OSS_PREFIX:-renshe}
  ALIYUN_OSS_SIGNED_URL_TTL_SECONDS: "300"
  RENSHE_TEMPLATE_DIR: /app/renshe-templates
  RENSHE_CLEANUP_RETENTION_DAYS: "30"
  HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-3}
  QUIZ_TASKS_ENABLED: "true"
  QUIZ_EMBEDDED_WORKER_ENABLED: "false"
  QUIZ_IMPORT_STORAGE_TYPE: ${QUIZ_IMPORT_STORAGE_TYPE:-disabled}
  QUIZ_OSS_ENDPOINT: ${QUIZ_OSS_ENDPOINT:-}
  QUIZ_OSS_BUCKET: ${QUIZ_OSS_BUCKET:-}
  QUIZ_OSS_ACCESS_KEY_ID_FILE: /run/secrets/quiz_oss_access_key_id
  QUIZ_OSS_ACCESS_KEY_SECRET_FILE: /run/secrets/quiz_oss_access_key_secret
  QUIZ_OSS_PREFIX: ${QUIZ_OSS_PREFIX:-quiz-imports}
  QUIZ_OSS_SIGNED_URL_TTL_SECONDS: "300"
  QUIZ_WORKER_POLL_SECONDS: ${QUIZ_WORKER_POLL_SECONDS:-5}
  QUIZ_WORKER_HEARTBEAT_SECONDS: ${QUIZ_WORKER_HEARTBEAT_SECONDS:-15}
  QUIZ_WORKER_STALE_SECONDS: ${QUIZ_WORKER_STALE_SECONDS:-120}
  QUIZ_WORKER_MAX_RETRIES: ${QUIZ_WORKER_MAX_RETRIES:-5}
  QUIZ_METRICS_ENABLED: "true"
  QUIZ_METRICS_BEARER_TOKEN_FILE: /run/secrets/quiz_metrics_bearer_token

x-backend-secrets: &backend_secrets
  - postgres_password
  - redis_url
  - jwt_secret
  - pii_hash_key
  - wechat_secret
  - wechat_pay_private_key
  - wechat_pay_api_v3_key
  - wechat_pay_public_key
  - aliyun_oss_access_key_id
  - aliyun_oss_access_key_secret
  - quiz_oss_access_key_id
  - quiz_oss_access_key_secret
  - quiz_metrics_bearer_token

services:
  uploads-init:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        mkdir -p \
          /app/uploads/private/quiz-imports \
          /app/uploads/private/renshe \
          /app/uploads/private/course-assets
        chown -R 10001:10001 /app/uploads
    volumes:
      - uploads:/app/uploads
    restart: "no"

  app:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    depends_on:
      uploads-init:
        condition: service_completed_successfully
    environment:
      <<: *backend_environment
      QUIZ_WORKER_PROCESS: "false"
    secrets: *backend_secrets
    volumes:
      - uploads:/app/uploads
      - ${RENSHE_TEMPLATE_HOST_DIR:?RENSHE_TEMPLATE_HOST_DIR is required}:/app/renshe-templates:ro
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  quiz-worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    entrypoint: []
    command: ["python", "-m", "app.quiz_worker"]
    environment:
      <<: *backend_environment
      QUIZ_WORKER_PROCESS: "true"
    secrets: *backend_secrets
    restart: unless-stopped

  admin:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE is required}
    environment:
      BACKEND_HOST: app
      BACKEND_PORT: "8000"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - 127.0.0.1:${ADMIN_PORT:-8080}:80
    restart: unless-stopped

  migration:
    profiles: [orchestration]
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    entrypoint: []
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend_environment
      QUIZ_WORKER_PROCESS: "false"
    secrets: *backend_secrets
    restart: "no"

  production-seed:
    profiles: [orchestration]
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    entrypoint: []
    command: ["python", "scripts/seed_production.py"]
    environment:
      <<: *backend_environment
      QUIZ_WORKER_PROCESS: "false"
    secrets: *backend_secrets
    restart: "no"

  db:
    profiles: [internal]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    profiles: [internal]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

secrets:
  postgres_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/postgres_password
  redis_url:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/redis_url
  jwt_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/jwt_secret
  pii_hash_key:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/pii_hash_key
  wechat_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/wechat_secret
  wechat_pay_private_key:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/wechat_pay_private_key
  wechat_pay_api_v3_key:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/wechat_pay_api_v3_key
  wechat_pay_public_key:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/wechat_pay_public_key
  aliyun_oss_access_key_id:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/aliyun_oss_access_key_id
  aliyun_oss_access_key_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/aliyun_oss_access_key_secret
  quiz_oss_access_key_id:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/quiz_oss_access_key_id
  quiz_oss_access_key_secret:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/quiz_oss_access_key_secret
  quiz_metrics_bearer_token:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/quiz_metrics_bearer_token
